[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-analyzer"
version = "0.1.0"
description = "CLI tool to analyze time allocation from JIRA issues"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Stefan" }
]
dependencies = [
    "typer[all]>=0.9.0",
    "jira>=3.5.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.8.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
web = [
    "flask>=3.0.0",
]

[project.scripts]
jira-analyzer = "jira_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
