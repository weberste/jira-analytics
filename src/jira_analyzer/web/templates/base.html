<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIRA Allocation Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('main.static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>JIRA Allocation Analyzer</h1>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <p>Use <code>jira-analyzer config show</code> to view configuration</p>
        </footer>
    </div>
    <script src="{{ url_for('main.static', filename='js/charts.js') }}"></script>
    <script src="{{ url_for('main.static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
