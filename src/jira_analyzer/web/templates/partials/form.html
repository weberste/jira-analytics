<div class="form-section">
    <form method="POST" action="{{ url_for('main.analyze') }}" id="analysis-form">
        <div class="form-group">
            <label>Query</label>
            <div class="query-mode-toggle">
                <button type="button" class="toggle-btn active" data-mode="project" id="mode-project-btn">Project</button>
                <button type="button" class="toggle-btn" data-mode="jql" id="mode-jql-btn">Custom JQL</button>
            </div>
            <div id="project-mode">
                <div class="searchable-select" id="project-select">
                    <input type="text" id="project-search" placeholder="Search projects..." autocomplete="off">
                    <div class="searchable-select-dropdown" id="project-dropdown"></div>
                </div>
                <input type="hidden" id="project-input" value="">
            </div>
            <div id="jql-mode" style="display: none;">
                <input type="text" id="jql-input"
                       placeholder='e.g., project = MYPROJ AND sprint = "Sprint 23"'
                       value="{{ jql or '' }}">
            </div>
            <input type="hidden" id="jql" name="jql" value="{{ jql or '' }}">
        </div>
        <div class="form-row form-row-controls">
            <div class="form-group">
                <label for="from_date">From</label>
                <input type="date" id="from_date" name="from_date"
                       value="{{ from_date or '' }}" required>
            </div>
            <div class="form-group">
                <label for="to_date">To</label>
                <input type="date" id="to_date" name="to_date"
                       value="{{ to_date or '' }}" required>
            </div>
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="no_cache" name="no_cache" value="1"
                           {{ 'checked' if no_cache else '' }}>
                    Don't use cached data
                </label>
            </div>
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="track_epic_time" name="track_epic_time" value="1"
                           {{ 'checked' if track_epic_time else '' }}>
                    Track time on epics
                </label>
            </div>
            <div class="form-group form-group-btn">
                <button type="submit" class="btn btn-primary" id="submit-btn">Analyze</button>
            </div>
        </div>
    </form>
</div>
