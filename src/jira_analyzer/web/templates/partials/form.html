<div class="form-section">
    <form method="POST" action="{{ url_for('main.analyze') }}" id="analysis-form">
        <div class="form-group">
            <label for="jql">JQL Query</label>
            <input type="text" id="jql" name="jql"
                   placeholder='e.g., project = MYPROJ AND sprint = "Sprint 23"'
                   value="{{ jql or '' }}" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="from_date">From Date</label>
                <input type="date" id="from_date" name="from_date"
                       value="{{ from_date or '' }}" required>
            </div>
            <div class="form-group">
                <label for="to_date">To Date</label>
                <input type="date" id="to_date" name="to_date"
                       value="{{ to_date or '' }}" required>
            </div>
        </div>
        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="no_cache" name="no_cache" value="1"
                       {{ 'checked' if no_cache else '' }}>
                Don't use cached data
            </label>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Analyze</button>
    </form>
</div>

<div class="loading" id="loading-indicator">
    <div class="spinner"></div>
    <p>Analyzing issues...</p>
</div>
